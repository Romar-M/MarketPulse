version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-pass}
      POSTGRES_DB: ${DB_NAME:-futures}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-futures}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-user}:${DB_PASS:-pass}@db:5432/${DB_NAME:-futures}
      THRESHOLD: ${THRESHOLD:-0.01}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    env_file:
      - .env
    restart: unless-stopped
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-user}:${DB_PASS:-pass}@db:5432/${DB_NAME:-futures}
      THRESHOLD: ${THRESHOLD:-0.01}
    env_file:
      - .env
    restart: unless-stopped
    command: ["streamlit", "run", "src/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-user}:${DB_PASS:-pass}@db:5432/${DB_NAME:-futures}
      THRESHOLD: ${THRESHOLD:-0.01}
    env_file:
      - .env
    restart: unless-stopped
    command: ["python", "-m", "src.main"]

volumes:
  pgdata:
